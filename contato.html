<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game of Thrones - Contato</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐉</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #2c2c2c;
            background-color: #f4f4f4;
        }

        header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            padding: 20px 0;
            text-align: center;
            border-bottom: 5px solid #c9a227;
        }

        header h1 {
            font-size: 2.5rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #c9a227;
        }

        header h2 {
            font-size: 1.1rem;
            font-weight: 300;
            color: #ddd;
            margin-top: 8px;
        }

        nav {
            margin-top: 15px;
        }

        nav a {
            color: #c9a227;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #fff;
            text-decoration: underline;
        }

        .titulo_secundario {
            background-color: #1a1a2e;
            color: #c9a227;
            padding: 10px 20px;
            margin: 30px 0 15px 0;
            border-left: 6px solid #c9a227;
            border-radius: 0 8px 8px 0;
        }

        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        section {
            margin-bottom: 30px;
        }

        form {
            background-color: #f9f9f9;
            padding: 25px;
            border-radius: 10px;
            border: 1px solid #ddd;
            margin-top: 20px;
        }

        fieldset {
            border: 2px solid #c9a227;
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 20px;
        }

        legend {
            font-weight: bold;
            color: #1a1a2e;
            padding: 0 10px;
            font-size: 1.1rem;
        }

        label {
            display: inline-block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #333;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            font-family: inherit;
        }

        input[type="radio"],
        input[type="checkbox"] {
            width: auto;
            margin-right: 6px;
        }

        input[type="color"] {
            height: 50px;
            padding: 5px;
            cursor: pointer;
        }

        input[type="range"] {
            padding: 0;
        }

        input[type="file"] {
            border: 2px dashed #c9a227;
            background-color: #fffdf5;
            cursor: pointer;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        select {
            cursor: pointer;
        }

        button {
            background-color: #1a1a2e;
            color: #c9a227;
            border: none;
            padding: 14px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            background-color: #c9a227;
            color: #1a1a2e;
            transform: scale(1.03);
        }

        button[type="reset"] {
            background-color: #666;
            color: #fff;
            margin-left: 10px;
        }

        footer {
            background-color: #1a1a2e;
            color: #ddd;
            text-align: center;
            padding: 25px 15px;
            margin-top: 40px;
            border-top: 5px solid #c9a227;
        }

        footer small {
            display: block;
            margin-top: 8px;
            color: #999;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <!-- Topo do site -->
    <header>
        <div>
            <h1>Game of Thrones</h1>
            <h2>A guerra pelo Trono de Ferro</h2>
            <nav>
                <a href="index.html">Home</a>
                <a href="contato.html">Contato</a>
            </nav>
        </div>
    </header>

    <!-- Conteúdo principal -->
    <main>

        <section id="contato">
            <h2 class="titulo_secundario">Formulário de Contato</h2>

            <div>
                <form action="#" method="post" autocomplete="off">

                    <!-- Dados pessoais -->
                    <fieldset>
                        <legend>Dados Pessoais</legend>

                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" name="nome" placeholder="Informe seu nome"
                               minlength="3" maxlength="50" required>

                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" placeholder="seu@email.com" required>

                        <label for="telefone">Telefone:</label>
                        <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000">

                        <label for="url">Site pessoal:</label>
                        <input type="url" id="url" name="url" placeholder="https://seusite.com">

                        <label for="senha">Senha:</label>
                        <input type="password" id="senha" name="senha" placeholder="Informe sua senha"
                               minlength="6" required>

                        <label for="numero">Idade:</label>
                        <input type="number" id="numero" name="numero" min="1" max="120" placeholder="Sua idade">

                        <label for="busca">Busca:</label>
                        <input type="search" id="busca" name="busca" placeholder="Pesquise algo...">
                    </fieldset>

                    <!-- Arquivos e cores -->
                    <fieldset>
                        <legend>Arquivos e Cores</legend>

                        <label for="arquivo">Anexe um arquivo:</label>
                        <input type="file" id="arquivo" name="arquivo">

                        <label for="cor">Escolha uma cor:</label>
                        <input type="color" id="cor" name="cor" value="#c9a227">
                    </fieldset>

                    <!-- Datas e horas -->
                    <fieldset>
                        <legend>Datas e Horas</legend>

                        <label for="data">Data:</label>
                        <input type="date" id="data" name="data">

                        <label for="mes">Mês:</label>
                        <input type="month" id="mes" name="mes">

                        <label for="semana">Semana:</label>
                        <input type="week" id="semana" name="semana">

                        <label for="hora">Hora:</label>
                        <input type="time" id="hora" name="hora">

                        <label for="datahora">Data e Hora:</label>
                        <input type="datetime-local" id="datahora" name="datahora">
                    </fieldset>

                    <!-- Preferências -->
                    <fieldset>
                        <legend>Preferências</legend>

                        <label for="nivel">Nível de interesse (1-10):</label>
                        <input type="range" id="nivel" name="nivel" min="1" max="10" value="5">

                        <p>Qual sua casa favorita?</p>
                        <label><input type="radio" name="casa" value="stark"> Stark</label>
                        <label><input type="radio" name="casa" value="lannister"> Lannister</label>
                        <label><input type="radio" name="casa" value="targaryen"> Targaryen</label>

                        <p>Quais temporadas você assistiu?</p>
                        <label><input type="checkbox" name="temp1" value="1"> Temporada 1</label>
                        <label><input type="checkbox" name="temp2" value="2"> Temporada 2</label>
                        <label><input type="checkbox" name="temp3" value="3"> Temporada 3</label>
                        <label><input type="checkbox" name="temp4" value="4"> Temporada 4</label>
                    </fieldset>

                    <!-- Seleções -->
                    <fieldset>
                        <legend>Seleções</legend>

                        <label for="personagem">Personagem favorito:</label>
                        <select id="personagem" name="personagem">
                            <optgroup label="Casa Stark">
                                <option value="ned">Eddard Stark</option>
                                <option value="arya">Arya Stark</option>
                                <option value="jon">Jon Snow</option>
                            </optgroup>
                            <optgroup label="Casa Lannister">
                                <option value="tyrion">Tyrion Lannister</option>
                                <option value="cersei">Cersei Lannister</option>
                                <option value="jaime">Jaime Lannister</option>
                            </optgroup>
                            <optgroup label="Casa Targaryen">
                                <option value="daenerys">Daenerys Targaryen</option>
                                <option value="viserys">Viserys Targaryen</option>
                            </optgroup>
                        </select>

                        <label for="episodio">Episódio favorito (datalist):</label>
                        <input list="episodios" id="episodio" name="episodio" placeholder="Digite ou selecione...">
                        <datalist id="episodios">
                            <option value="Winter is Coming">
                            <option value="The Rains of Castamere">
                            <option value="The Winds of Winter">
                            <option value="Battle of the Bastards">
                            <option value="The Long Night">
                        </datalist>
                    </fieldset>

                    <!-- Mensagem -->
                    <fieldset>
                        <legend>Mensagem</legend>

                        <label for="descricao">O que você mais gosta na série?</label>
                        <textarea id="descricao" name="descricao" rows="6" cols="50"
                                  placeholder="Escreva sua opinião..."></textarea>
                    </fieldset>

                    <button type="submit">Enviar Formulário</button>
                    <button type="reset">Limpar</button>

                </form>
            </div>
        </section>

    </main>

    <!-- Rodapé -->
    <footer>
        <div>
            <p>&copy; 2026 - Game of Thrones Fan Site.</p>
            <small>Projeto educacional sem fins comerciais.</small>
        </div>
    </footer>

</body>
</html>
