</head>
<body>
    <div id="titulo_principal">
        <h1>Game of Thrones</h1>
        <h2>A guerra pelo Trono de Ferro</h2>

            <a href="index.html">Home</a>

    <h2 class="titulo_secundario">Entre em contato:</h2>

    <form action="processa.php" method="post" autocomplete="off">
    <label for="nomepessoa">Nome:</label>
    <input type="text" name="nomepessoa" id="nomepessoa" minlength="3" maxlength="15" placeholder="Informe seu nome" required><br><br>

        <label for="email">Email:</label>
        <input type="email" name="email" id="email" required placeholder="E-mail"><br><br>

        <label for="ano">Ano de nascimento:</label>
        <input type="number" id="ano" name="ano" max="2026" min="1900" placeholder="Informe ano de nascimento"><br><br>

        <label for="telefone">Telefone</label>
        <input type="tel" name="telefone" id="telefone" placeholder="Informe seu telefone"><br><br>

        <label for="github">Informe seu github:</label>
        <input type="url" name="github" id="github" placeholder="Informe seu github"><br><br>

        <label for="senha">Informe sua senha:</label>
        <input type="password" id="senha" name="senhax"><br><br>

        <label for="arquivo">Anexe um arquivo:</label>
        <input type="file" id="arquivo" name="arquivo"><br><br>

        <label for="cor">Escolha uma cor:</label>
        <input type="color" id="cor" name="cor"><br><br>

        <fieldset>
            <legend>Campos de tempo</legend>
            <label for="data">Informe a data</label>
            <input type="date" name="data" id="data"><br><br>

            <label for="mes">Informe o mês</label>
            <input type="month" name="mes" id="mes"><br><br>

            <label for="semana">Informe a semana</label>
            <input type="week" name="semana" id="semana"><br><br>

            <label for="hora">Informe a hora:</label>
            <input type="time" name="hora" id="hora"><br><br>

            <label for="datahora">Data e hora atual</label>
            <input type="datetime-local" name="datahora" id="datahora"><br><br>
        </fieldset>

        <label for="pesquisa">Pesquisa</label>
        <input type="search" id="pesquisa" name="pesquisa"><br><br>

        <label for="descricao">Informe aqui o que você gosta na série:</label><br>
        <textarea cols="30" rows="10" name="descricao" id="descricao"></textarea><br><br>

        <fieldset>
            <legend>Qual sua temporada favorita?</legend>
            <label for="temp1"><input type="radio" name="temporada" id="temp1" value="Temporada 1">Temporada 1</label>
            <label for="temp2"><input checked type="radio" name="temporada" id="temp2" value="Temporada 2">Temporada 2</label>
            <label for="temp3"><input type="radio" name="temporada" id="temp3" value="Temporada 3">Temporada 3</label>
        </fieldset><br><br>

        <label for="nivel">Escolha o nível</label>
        <input type="range" max="10" min="1" id="nivel" name="nivel">

        <label>Escolha um personagem:</label>
        <select id="lista_suspensa" name="lista">
            <optgroup label="Casa Stark">
                <option value="Ned">Eddard Stark</option>
                <option value="Arya">Arya Stark</option>
                <option value="Jon">Jon Snow</option>
            </optgroup>
            <optgroup label="Casa Lannister">
                <option value="Tyrion">Tyrion Lannister</option>
                <option value="Cersei">Cersei Lannister</option>
                <option value="Jaime">Jaime Lannister</option>
            </optgroup>
            <optgroup label="Casa Targaryen">
                <option value="Daenerys">Daenerys Targaryen</option>
                <option value="Viserys">Viserys Targaryen</option>
            </optgroup>
        </select><br><br>

                <fieldset>
            <legend>Quais casas você apoia?</legend>
            <label><input type="checkbox" name="stark" value="stark"> Stark</label>
            <label><input type="checkbox" name="lannister" value="lannister"> Lannister</label>
            <label><input type="checkbox" name="targaryen" value="targaryen"> Targaryen</label>
            <label><input type="checkbox" name="baratheon" value="baratheon"> Baratheon</label>
            <label><input type="checkbox" name="greyjoy" value="greyjoy"> Greyjoy</label>
            <label><input type="checkbox" name="martell" value="martell"> Martell</label>
        </fieldset><br><br>

        <!-- Datalist possíveis personagens -->
        <label for="busca_datalist">Escolha um personagem:</label>
        <input type="text" id="busca_datalist" list="personagens_datalist" placeholder="Digite ou selecione...">
        <datalist id="personagens_datalist">
            <option>Jon Snow</option>
            <option>Daenerys Targaryen</option>
            <option>Tyrion Lannister</option>
            <option>Arya Stark</option>
            <option>Sansa Stark</option>
            <option>Bran Stark</option>
        </datalist><br><br>

        <audio controls muted autoplay loop>
            <source src="audio/musica.mp3" type="audio/mp3">
            Navegador não é compatível para executar áudio!
        </audio><br><br>

        <video controls autoplay loop poster="">
            <source src="videos/videoteste.mp4" type="video/mp4">
        </video><br><br>

        <iframe width="560" height="315"
                src="https://www.youtube.com/embed/KPLWWIOCOOQ"
                title="YouTube video player"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen></iframe><br><br>

        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2307.288!2d-5.9303!3d54.6037!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zNTTCsDM2JzEzLjMiTiA1wrA1NSc0OS4xIlc!5e0!3m2!1spt-BR!2sbr!4v1234567890"
                width="600" height="450" style="border:0;"
                allowfullscreen="" loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"></iframe>

        <button type="reset">Limpar</button>
        <button type="submit">Enviar</button>
    </form>
</body>
</html>
